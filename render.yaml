services:
  - type: web
    name: web-player-api
    runtime: python
    buildCommand: |
      pip install djangorestframework pillow django-cors-headers gunicorn mutagen
      mkdir -p media/tracks media/covers
      python manage.py collectstatic --noinput
      cp -r media/covers/* media/covers/ || true
      cp -r media/tracks/* media/tracks/ || true
      python manage.py migrate
    startCommand: |
      python manage.py collectstatic --noinput
      gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        value: postgresql://user:pass@localhost:5432/db
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
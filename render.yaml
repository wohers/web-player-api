services:
  - type: web
    name: web-player-api
    runtime: python
    buildCommand: |
      pip install djangorestframework pillow django-cors-headers gunicorn mutagen &&
      mkdir -p media/covers media/tracks &&
      python manage.py makemigrations &&
      python manage.py migrate &&
      python manage.py collectstatic --noinput
    startCommand: |
      python manage.py collectstatic --noinput
      gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        value: postgresql://user:pass@localhost:5432/db
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"